<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Debris Tracker</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #globeViz {
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: min(360px, calc(100vw - 40px));
      background: rgba(0, 0, 0, 0.82);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px;
      box-sizing: border-box;
      backdrop-filter: blur(4px);
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 22px;
      color: #ff5a5a;
    }
    .sub {
      color: #bdbdbd;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .row {
      margin-bottom: 8px;
      font-size: 16px;
    }
    input[type="range"] {
      width: 100%;
      margin-top: 8px;
    }
    .legend {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.6;
      color: #ddd;
    }
    .dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }
    #status {
      color: #7fdcff;
    }
    #error {
      display: none;
      margin-top: 10px;
      padding: 8px;
      background: rgba(90, 10, 10, 0.45);
      border: 1px solid #733;
      border-radius: 8px;
      color: #ffb3b3;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>ORBITAL DEBRIS TRACKER</h1>
    <div class="sub">Real Space-Track snapshot. The slider shows objects launched through the selected year.</div>

    <div class="row">Year: <span id="yearDisplay">2024</span></div>
    <div class="row">Objects shown: <span id="countDisplay">0</span></div>
    <div class="row">Status: <span id="status">Loading...</span></div>

    <input type="range" id="yearSlider" min="1957" max="2050" value="2024" step="1" />

    <div class="legend">
      <div><span class="dot" style="background:#ff4444;"></span>Debris</div>
      <div><span class="dot" style="background:#ffa500;"></span>Rocket body</div>
      <div><span class="dot" style="background:#00ccff;"></span>Payload</div>
      <div><span class="dot" style="background:#ffff00;"></span>Other</div>
    </div>

    <div id="error"></div>
  </div>

  <div id="globeViz"></div>

  <script>
    const INITIAL_YEAR = 2024;
    const MAX_RENDER_POINTS = 1800;
    const EARTH_RADIUS_KM = 6371;

    const yearSlider = document.getElementById('yearSlider');
    const yearDisplay = document.getElementById('yearDisplay');
    const countDisplay = document.getElementById('countDisplay');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');

    let allObjects = [];

const globe = Globe()(document.getElementById('globeViz'))
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
  .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
  .pointOfView({ altitude: 2.2 })

  // DOT SETTINGS
  .pointLat('lat')
  .pointLng('lng')
  .pointColor(d => d.color)
  .pointAltitude(d => d.alt * 0.6)
  .pointRadius(0.35)
  .pointResolution(6)
  .pointsMerge(false);
  
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.45;

    function showError(msg) {
      errorEl.style.display = 'block';
      errorEl.textContent = msg;
    }

    function getYear(row) {
      if (row.LAUNCH_DATE) {
        const y = new Date(row.LAUNCH_DATE).getUTCFullYear();
        if (!Number.isNaN(y)) return y;
      }
      if (row.OBJECT_ID) {
        const m = String(row.OBJECT_ID).match(/^(\d{4})-/);
        if (m) return Number(m[1]);
      }
      if (row.EPOCH) {
        const y = new Date(row.EPOCH).getUTCFullYear();
        if (!Number.isNaN(y)) return y;
      }
      return null;
    }

    function getColor(type) {
      const t = String(type || '').toUpperCase();
      if (t === 'DEBRIS') return '#ff4444';
      if (t === 'ROCKET BODY') return '#ffa500';
      if (t === 'PAYLOAD') return '#00ccff';
      return '#ffff00';
    }

    function seededJitter(seed) {
      const x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    function orbitalPosition(inclinationDeg, raanDeg, meanAnomalyDeg, eccentricity, seed) {
      const inc = (Number.isFinite(inclinationDeg) ? inclinationDeg : 45) * Math.PI / 180;
      const raan = Number.isFinite(raanDeg) ? raanDeg : 0;
      const anomaly = (Number.isFinite(meanAnomalyDeg) ? meanAnomalyDeg : 0) * Math.PI / 180;

      const j1 = (seededJitter(seed * 1.11 + 9) - 0.5) * (Math.PI / 80);
      const j2 = (seededJitter(seed * 1.73 + 21) - 0.5) * 5.5;
      const u = anomaly + j1;

      const sinLat = Math.sin(inc) * Math.sin(u);
      let lat = Math.asin(Math.max(-1, Math.min(1, sinLat))) * 180 / Math.PI;

      let lng = raan + (Math.atan2(Math.cos(inc) * Math.sin(u), Math.cos(u)) * 180 / Math.PI);
      lng += j2;
      lng = ((lng + 540) % 360) - 180;

      const ecc = Number.isFinite(eccentricity) ? eccentricity : 0;
      lat += (seededJitter(seed * 2.05 + 4) - 0.5) * Math.min(1.4, 0.35 + 18 * ecc);
      lat = Math.max(-89.5, Math.min(89.5, lat));

      return { lat, lng };
    }

    function scaledAltitude(apKm, peKm) {
      const meanAltKm = Math.max(160, ((apKm + peKm) / 2) || 160);

      // Use a visually compressed altitude so points show clearly but don't become giant spikes.
      let raw;
      if (meanAltKm <= 2000) {
        raw = meanAltKm / EARTH_RADIUS_KM;
      } else if (meanAltKm <= 10000) {
        raw = 2000 / EARTH_RADIUS_KM + (meanAltKm - 2000) / 30000;
      } else {
        raw = 2000 / EARTH_RADIUS_KM + 8000 / 30000 + Math.log10(meanAltKm - 9000) / 8;
      }

      return Math.min(0.10, Math.max(0.012, raw * 0.12));
    }

    function normalizeRow(row, index) {
      const apogee = Number(row.APOAPSIS ?? row.APOGEE ?? 0);
      const perigee = Number(row.PERIAPSIS ?? row.PERIGEE ?? 0);
      const inclination = Number(row.INCLINATION ?? 45);
      const raan = Number(row.RA_OF_ASC_NODE ?? 0);
      const meanAnomaly = Number(row.MEAN_ANOMALY ?? 0);
      const eccentricity = Number(row.ECCENTRICITY ?? 0);
      const seed = Number(row.NORAD_CAT_ID ?? index + 1);

      const pos = orbitalPosition(inclination, raan, meanAnomaly, eccentricity, seed);

      return {
        year: getYear(row),
        lat: pos.lat,
        lng: pos.lng,
        alt: scaledAltitude(apogee, perigee),
        color: getColor(row.OBJECT_TYPE)
      };
    }

    function downsample(arr, maxCount) {
      if (arr.length <= maxCount) return arr;
      const step = Math.ceil(arr.length / maxCount);
      return arr.filter((_, i) => i % step === 0);
    }

    function updateVisualization(year) {
      const numericYear = Number(year);
      yearDisplay.textContent = numericYear;

      const filtered = allObjects.filter(d => d.year && d.year <= numericYear);
      const renderData = downsample(filtered, MAX_RENDER_POINTS);

      countDisplay.textContent = filtered.length.toLocaleString();
      globe.pointsData(renderData);

      console.log('filtered', filtered.length, 'rendered', renderData.length, renderData[0]);
    }

    yearSlider.addEventListener('input', e => {
      updateVisualization(e.target.value);
    });

    fetch('./spacetrack_snapshot.json', { cache: 'no-store' })
      .then(r => {
        if (!r.ok) throw new Error(`Could not load spacetrack_snapshot.json (${r.status})`);
        return r.json();
      })
      .then(rows => {
        allObjects = rows
          .map((row, i) => normalizeRow(row, i))
          .filter(d =>
            d.year &&
            Number.isFinite(d.lat) &&
            Number.isFinite(d.lng) &&
            Number.isFinite(d.alt)
          );

        statusEl.textContent = `Loaded ${allObjects.length.toLocaleString()} records`;
        updateVisualization(INITIAL_YEAR);
      })
      .catch(err => {
        statusEl.textContent = 'Load failed';
        showError('Could not load data. Keep spacetrack_snapshot.json in the same folder as this HTML file and open through http://localhost:8000.');
        console.error(err);
      });

    window.addEventListener('resize', () => {
      globe.width(window.innerWidth);
      globe.height(window.innerHeight);
    });
  </script>
</body>
</html>
