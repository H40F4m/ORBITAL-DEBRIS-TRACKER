<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orbital Debris Tracker</title>

  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      color: white;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.85);
      padding: 14px;
      border-radius: 10px;
      width: 260px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #ff5a5a;
    }

    .row {
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
    }
  </style>
</head>
<body>

<div id="ui">
  <h1>ORBITAL DEBRIS</h1>
  <div class="row">Year: <span id="yearDisplay">2024</span></div>
  <div class="row">Objects: <span id="countDisplay">0</span></div>
  <input type="range" id="yearSlider" min="1957" max="2024" value="2024"/>
</div>

<script>
const EARTH_RADIUS = 12;
const MAX_OBJECTS = 800;

const yearSlider = document.getElementById('yearSlider');
const yearDisplay = document.getElementById('yearDisplay');
const countDisplay = document.getElementById('countDisplay');

let allObjects = [];
let orbitObjects = [];

// SCENE
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 20, 40);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(20,10,20);
scene.add(light);

// EARTH
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS, 64, 64),
  new THREE.MeshPhongMaterial({ color: 0x2266aa })
);
scene.add(earth);

// STARS
const starGeo = new THREE.BufferGeometry();
const starCount = 2000;
const starPos = new Float32Array(starCount * 3);

for (let i = 0; i < starCount; i++) {
  starPos[i*3] = (Math.random()-0.5)*1000;
  starPos[i*3+1] = (Math.random()-0.5)*1000;
  starPos[i*3+2] = (Math.random()-0.5)*1000;
}

starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));

const stars = new THREE.Points(
  starGeo,
  new THREE.PointsMaterial({ color: 0xffffff, size: 1 })
);
scene.add(stars);

// HELPERS
function getYear(row) {
  if (row.LAUNCH_DATE) return new Date(row.LAUNCH_DATE).getUTCFullYear();
  return null;
}

function getColor(type) {
  const t = String(type || '').toUpperCase();
  if (t === 'DEBRIS') return 0xff4444;
  if (t === 'ROCKET BODY') return 0xffa500;
  if (t === 'PAYLOAD') return 0x00ccff;
  return 0xffff00;
}

function getRadius(ap, pe) {
  const alt = Math.max(160, (ap + pe)/2 || 160);
  return EARTH_RADIUS + alt / 300;
}

// CREATE ORBIT OBJECT
function createObject(data) {
  const group = new THREE.Group();

  const tilt = new THREE.Object3D();
  tilt.rotation.z = data.inclination;
  group.add(tilt);

  const pivot = new THREE.Object3D();
  pivot.rotation.y = data.phase;
  tilt.add(pivot);

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 8, 8),
    new THREE.MeshBasicMaterial({ color: data.color })
  );

  mesh.position.x = data.radius;
  pivot.add(mesh);

  scene.add(group);

  return {
    group,
    pivot,
    speed: data.speed
  };
}

// UPDATE
function updateVisualization(year) {
  yearDisplay.textContent = year;

  orbitObjects.forEach(o => scene.remove(o.group));
  orbitObjects = [];

  const filtered = allObjects.filter(d => d.year <= year).slice(0, MAX_OBJECTS);

  countDisplay.textContent = filtered.length;

  orbitObjects = filtered.map(createObject);
}

// LOAD DATA
fetch('./spacetrack_snapshot.json')
.then(r => r.json())
.then(rows => {
  allObjects = rows.map((row, i) => {
    const ap = Number(row.APOAPSIS || 0);
    const pe = Number(row.PERIAPSIS || 0);
    const inc = Number(row.INCLINATION || 45);

    return {
      year: getYear(row),
      radius: getRadius(ap, pe),
      color: getColor(row.OBJECT_TYPE),
      inclination: inc * Math.PI/180,
      phase: Math.random() * Math.PI * 2,
      speed: 0.002 + Math.random()*0.005
    };
  }).filter(d => d.year);

  updateVisualization(2024);
});

// SLIDER
yearSlider.addEventListener('input', e => {
  updateVisualization(Number(e.target.value));
});

// CAMERA ROTATION
let angle = 0;

// ANIMATION
function animate() {
  requestAnimationFrame(animate);

  earth.rotation.y += 0.001;

  orbitObjects.forEach(obj => {
    obj.pivot.rotation.y += obj.speed;
  });

  // AUTO CAMERA
  angle += 0.0015;
  camera.position.x = Math.cos(angle) * 40;
  camera.position.z = Math.sin(angle) * 40;
  camera.position.y = 20;
  camera.lookAt(0,0,0);

  renderer.render(scene, camera);
}
animate();

// RESIZE
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
